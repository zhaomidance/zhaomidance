<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>蒙面舞会 · 婚配玩法</title>
<link rel="stylesheet" href="style.css?v=20261024f">
</head>
<body>

<span class="ambient-mask">🎭</span>
<span class="ambient-mask left">🌹</span>

<div class="page active" id="mainPage">

  <header class="app-header">
    <div class="brand">
      <div class="brand-mask">🎭</div>
      <div class="brand-text">
        <div class="brand-title">蒙面舞会</div>
        <div class="brand-sub">假面之下 · 心动之名</div>
      </div>
    </div>
    <div class="header-right">
      <span class="identity-pill" id="identityPill" style="display:none"></span>
      <span class="balance-pill" id="balancePill" style="display:none">💎 0</span>
      <button class="btn btn-gold btn-sm" id="openRegisterBtn">我要报名</button>
      <button class="link-btn" id="logoutBtn" style="display:none">换号</button>
    </div>
  </header>

  <main class="app-main">

    <!-- 阶段横幅 -->
    <section class="stage-banner">
      <div class="stage-kicker">Masked Ball · <span id="roundText">第 1 轮</span></div>
      <h1 class="stage-title" id="stageTitle">报 名 中</h1>
      <p class="stage-desc" id="stageDesc">舞会序幕已拉开，静候各位戴上面具入场</p>
    </section>

    <!-- 统计 -->
    <div class="stats">
      <div class="stat-box male">
        <div class="num" id="maleWaitNum">0</div>
        <div class="lbl">男宾待匹配</div>
      </div>
      <div class="stat-box female">
        <div class="num" id="femaleWaitNum">0</div>
        <div class="lbl">女宾待匹配</div>
      </div>
      <div class="stat-box">
        <div class="num" id="coupleCount">0</div>
        <div class="lbl">今夜佳偶</div>
      </div>
    </div>

    <!-- 我的状态 -->
    <section class="my-card" id="myCard" style="display:none">
      <div id="myWaiting">
        <div class="my-state-head">
          <span class="big-emoji">🕯️</span>
          <div>
            <h2>已入席，静候良人</h2>
            <p>命运正在为你牵引红线，可随时离开，回来再看结果</p>
          </div>
        </div>
        <div class="progress-track"><div class="progress-bar"></div></div>
      </div>

      <div id="myMatched" style="display:none">
        <div class="my-state-head">
          <span class="big-emoji">💍</span>
          <div>
            <h2>良缘既定</h2>
            <p id="lockStatus">红线未锁，尚可更换</p>
          </div>
        </div>
        <div class="my-couple">
          <div class="names">
            <span id="myName">-</span>
            <span class="heart">❤</span>
            <span id="spouseName">-</span>
          </div>
          <div class="bond" id="myBond">缘分牵引 · 今夜共舞</div>
        </div>
        <div class="marriage-actions">
          <button class="act-btn lock" id="lockBtn">
            <div class="act-title">🔒 锁定</div>
            <div class="act-cost">1314 💎</div>
          </button>
          <button class="act-btn divorce" id="divorceBtn">
            <div class="act-title">💔 离婚</div>
            <div class="act-cost">1111 💎</div>
          </button>
          <button class="act-btn force" id="forceBtn">
            <div class="act-title">⚡ 强解</div>
            <div class="act-cost">5555 💎</div>
          </button>
        </div>
        <p class="warn-tip" id="marriageTip"></p>
      </div>
    </section>

    <!-- 已匹配：今夜佳偶 -->
    <section class="matched-section">
      <div class="section-head">
        <span class="head-line"></span>
        <h2>今夜佳偶</h2>
        <span class="head-line"></span>
      </div>
      <div class="couple-wall" id="coupleGrid"></div>
    </section>

    <!-- 待匹配 -->
    <section>
      <div class="section-head">
        <span class="head-line"></span>
        <h2>静候良人</h2>
        <span class="head-line"></span>
      </div>
      <div class="waiting-wrap">
        <div class="wait-panel male">
          <div class="wait-head male"><span>👦 男宾</span><b id="maleNum">0</b></div>
          <div class="chips" id="maleChips"></div>
        </div>
        <div class="wait-panel female">
          <div class="wait-head female"><span>👧 女宾</span><b id="femaleNum">0</b></div>
          <div class="chips" id="femaleChips"></div>
        </div>
      </div>
    </section>

    <!-- 任务（匹配成功后展示） -->
    <div class="task-board" id="taskBoard" style="display:none">
      <h2>🌹 今夜任务</h2>
      <ul class="task-list-screen" id="taskList"></ul>
    </div>

  </main>
</div>

<!-- ============ 报名弹窗 ============ -->
<div class="modal" id="registerModal">
  <div class="modal-card">
    <button class="modal-close" id="closeRegister">✕</button>
    <div class="modal-title">入 场 券</div>

    <!-- QQ 获取：按钮 + 手动输入默认展开（自动拿不到就直接手填） -->
    <div class="qq-fetch-row" id="qqFetchRow">
      <span class="qq-state" id="qqState">未获取</span>
      <button class="btn btn-ghost btn-sm btn-qq" id="fetchQqBtn" type="button">🔄 尝试自动获取</button>
    </div>
    <div class="qq-manual" id="qqManual">
      <div class="form-group" style="margin-bottom:6px">
        <label>手动填写 QQ 号</label>
        <input type="text" id="qqManualInput" placeholder="请输入你的 QQ 号（5-12 位）" maxlength="12" autocomplete="off">
      </div>
      <button class="btn btn-primary btn-sm" id="qqManualBtn">确认使用这个 QQ</button>
    </div>

    <div class="form-group">
      <label>群内二字马甲</label>
      <input type="text" id="majiaInput" placeholder="请输入两个字的马甲" maxlength="2" autocomplete="off">
    </div>
    <div class="form-group">
      <label>性别</label>
      <div class="gender-select">
        <button class="gender-btn" data-g="male">👦 男宾</button>
        <button class="gender-btn" data-g="female">👧 女宾</button>
      </div>
    </div>
    <div class="form-group">
      <label>许愿对象 <span class="opt">（选填）</span></label>
      <textarea id="wishInput" maxlength="40" placeholder="你希望遇见怎样的舞伴？"></textarea>
    </div>
    <div class="form-group">
      <label>我的模样 <span class="opt">（选填）</span></label>
      <textarea id="aboutInput" maxlength="40" placeholder="用几个词描述自己"></textarea>
    </div>

    <button class="btn btn-gold btn-block" id="registerBtn">缴纳 999 灵石 · 入场</button>
    <div class="modal-rules">
      报名 999 · 锁定 1314 · 离婚 1111 · 强制解除 5555<br>
      灵石一经缴纳，除特殊说明外不退
    </div>
  </div>
</div>

<!-- ============ 确认弹窗 ============ -->
<div class="modal" id="confirmModal">
  <div class="modal-card">
    <h3 id="confirmTitle">确认操作</h3>
    <p id="confirmText"></p>
    <div class="modal-btns">
      <button class="btn btn-gold" id="confirmOk">确定</button>
      <button class="btn btn-ghost" id="confirmCancel">取消</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="data.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const C = ZMD.config;

  const STAGES = {
    registering: { title: '报 名 中', desc: '舞会序幕已拉开，静候各位戴上面具入场', badge: '🔮 报名中' },
    round1:      { title: '第一次匹配', desc: '第一缕目光交汇，红线初系', badge: '💫 第一次匹配' },
    round2:      { title: '第二次匹配', desc: '心弦暗动，情愫暗生', badge: '💫 第二次匹配' },
    final:       { title: '最终匹配', desc: '曲终人未散，命中注定的人已在灯火阑珊处', badge: '💍 最终匹配' }
  };

  let myQQ = null;
  let myPlayer = null;
  let chosenGender = null;
  let toastTimer = null;

  function toast(msg, type) {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast show' + (type ? ' ' + type : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.className = 'toast', 2600);
  }
  function openModal(id) { $(id).style.display = 'flex'; }
  function closeModal(id) { $(id).style.display = 'none'; }

  // ===== QQ 自动获取（激进重试 + 多桥接兜底） =====
  // QQ 内打开？
  function isInQQ() {
    const ua = (navigator.userAgent || '') + ' ' + (navigator.vendor || '');
    return /MQQBrowser|\bQQ\b|TencentQQ|AQQ/i.test(ua);
  }
  // 找 bridge：兼容不同容器挂载位置
  function getBridge() {
    const cands = [window, parent, top, self];
    for (const w of cands) {
      if (!w) continue;
      if (w !== window) { try { if (w.mqq) return w.mqq; } catch(e) {} }
      if (w.mqq) return w.mqq;
      if (w.MQQBrowser && w.MQQBrowser.jsBridge) return w.MQQBrowser.jsBridge;
      if (w.__JSBRIDGE__) return w.__JSBRIDGE__;
    }
    return null;
  }
  const qqValid = s => /^\d{5,12}$/.test(String(s || '').trim());

  // 一次性尝试所有 bridge 方法
  let qqFired = false;
  function callAllBridgeMethods(mqq) {
    const tryFill = qq => {
      if (qqFired) return;
      if (qqValid(qq)) { qqFired = true; fillQQ(qq); return true; }
      return false;
    };
    try {
      // 官方 mqq.invoke 体系
      if (typeof mqq.invoke === 'function') {
        // 先试试 openLogin（部分容器需先授权）
        try {
          mqq.invoke('ui', 'openLogin', r => {
            if (r && (r.qq || r.uin || r.userId)) tryFill(r.qq || r.uin || r.userId);
          });
        } catch(e) {}
        // data 域
        mqq.invoke('data', 'getQQNumber', r => tryFill(r && (r.qq_number || r.qq || r.uin)));
        mqq.invoke('data', 'getUserInfo', r => tryFill(r && (r.uin || r.qq || r.qq_number)));
        mqq.invoke('data', 'getLoginInfo', r => tryFill(r && (r.qq || r.uin)));
        // account 域
        mqq.invoke('account', 'getUserAccount', r => tryFill(r && (r.qq_number || r.qq || r.uin)));
        mqq.invoke('account', 'getAccount', r => tryFill(r && (r.qq || r.uin || r.account)));
        // ui 域（部分版本）
        mqq.invoke('ui', 'getUserInfo', r => tryFill(r && (r.qq || r.uin)));
        // 另外：getAppInfo 也可能携带
        mqq.invoke('app', 'getAppInfo', r => tryFill(r && (r.qq || r.uin)));
      }
      // mqq.data 直挂
      if (mqq.data) {
        ['getQQNumber','getUserInfo','getLoginInfo','getAccount'].forEach(m => {
          try {
            if (typeof mqq.data[m] === 'function') {
              mqq.data[m](r => tryFill(r && (r.qq_number || r.qq || r.uin || r.account)));
            }
          } catch(e) {}
        });
      }
      // mqq.account 直挂
      if (mqq.account) {
        ['getAccount','getUserAccount','getLoginInfo'].forEach(m => {
          try {
            if (typeof mqq.account[m] === 'function') {
              mqq.account[m](r => tryFill(r && (r.qq || r.uin || r.account)));
            }
          } catch(e) {}
        });
      }
      // mqq.ui 直挂
      if (mqq.ui) {
        ['getUserInfo','openLogin'].forEach(m => {
          try {
            if (typeof mqq.ui[m] === 'function')
              mqq.ui[m](r => tryFill(r && (r.qq || r.uin || r.userId)));
          } catch(e) {}
        });
      }
      // mqq.getQQNumber 直接挂在根上（极少数老版本）
      ['getQQNumber','getUserInfo','getAccount'].forEach(m => {
        try {
          if (typeof mqq[m] === 'function')
            mqq[m](r => tryFill(r && (r.qq_number || r.qq || r.uin || r.account)));
        } catch(e) {}
      });
    } catch(e) {}
  }

  // 启动 bridge 轮询：最多轮询 5 秒，每 200ms 试一次
  function startBridgePolling() {
    const start = Date.now();
    const timer = setInterval(() => {
      if (qqFired) { clearInterval(timer); return; }
      const mqq = getBridge();
      if (mqq) { callAllBridgeMethods(mqq); }
      if (Date.now() - start > 5000) clearInterval(timer);
    }, 200);
  }

  // 入口：返回同步可得的 QQ（URL / localStorage），同时异步启动 bridge 尝试
  function detectQQ() {
    // 1) URL 参数（最快）
    const urlQq = new URLSearchParams(location.search).get('qq');
    if (qqValid(urlQq)) return urlQq;
    // 2) localStorage 缓存（回来不用重填）
    const cache = localStorage.getItem('zmd_qq');
    if (qqValid(cache)) return cache;

    // 3) bridge 同步可见吗？可见则立刻调用一次全部方法
    const mqq = getBridge();
    if (mqq) { callAllBridgeMethods(mqq); }
    // 4) 不论是否同步可见，都启动轮询（bridge 可能稍后才注入）
    startBridgePolling();
    return null;
  }

  function fillQQ(qq) {
    const q = String(qq).trim();
    localStorage.setItem('zmd_qq', q);
    myQQ = q;
    // 同步更新弹窗（已打开的情况下）
    const btn = $('fetchQqBtn'), state = $('qqState');
    if (btn) { btn.textContent = '✅ 已获取：' + q; btn.disabled = true; }
    if (state) { state.textContent = '已获取'; state.style.color = 'var(--green)'; }
    // 自动折叠手动输入（如果弹窗已开）
    const manual = $('qqManual');
    if (manual) manual.style.display = 'none';
  }

  // 弹窗里点按钮主动获取
  function fetchQqFromBtn() {
    const btn = $('fetchQqBtn'), state = $('qqState');
    btn.disabled = true; btn.textContent = '🔄 正在获取...';
    state.textContent = '识别 QQ 桥接中（最多 5 秒）'; state.style.color = '';

    qqFired = false;
    const direct = detectQQ(); // URL/cache 可能同步命中
    if (direct) { fillQQ(direct); return; }

    // 等最多 5 秒，期间 bridge 轮询在跑，只要回调一次就能填上
    const start = Date.now();
    const waiter = setInterval(() => {
      if (myQQ) { clearInterval(waiter); return; } // fillQQ 已触发
      if (Date.now() - start > 5500) {
        clearInterval(waiter);
        btn.disabled = false; btn.textContent = '🔄 再次尝试';
        state.textContent = '自动获取失败'; state.style.color = 'var(--red)';
        toast('自动获取未成功，请在下方手动填写 QQ 号', 'error');
        // 确保手动输入可见
        const m = $('qqManual'); if (m) m.style.display = '';
      }
    }, 250);
  }

  // ===== 大屏渲染 =====
  function renderBoard(data) {
    const players = Object.values(data.players || {});
    const waiting = players.filter(p => p.status === 'registered');
    const males = waiting.filter(p => p.gender === 'male');
    const females = waiting.filter(p => p.gender === 'female');

    // 阶段
    const stage = STAGES[data.stage] || STAGES.registering;
    $('stageTitle').textContent = stage.title;
    $('stageDesc').textContent = stage.desc;
    $('roundText').textContent = '第 ' + (data.round || 1) + ' 轮';

    // 统计
    $('maleWaitNum').textContent = males.length;
    $('femaleWaitNum').textContent = females.length;
    $('maleNum').textContent = males.length;
    $('femaleNum').textContent = females.length;

    // 待匹配
    const mChips = $('maleChips'), fChips = $('femaleChips');
    mChips.innerHTML = ''; fChips.innerHTML = '';
    if (!males.length) mChips.innerHTML = '<span class="chip-empty">虚位以待…</span>';
    if (!females.length) fChips.innerHTML = '<span class="chip-empty">虚位以待…</span>';
    males.forEach(p => {
      const c = document.createElement('span');
      c.className = 'chip male';
      c.textContent = p.majia;
      mChips.appendChild(c);
    });
    females.forEach(p => {
      const c = document.createElement('span');
      c.className = 'chip female';
      c.textContent = p.majia;
      fChips.appendChild(c);
    });

    // 已匹配（大卡片）
    const grid = $('coupleGrid');
    grid.innerHTML = '';
    const seen = new Set();
    let coupleCount = 0;
    for (const qq in data.players) {
      const p = data.players[qq];
      if (p.status !== 'matched' || !p.partner || seen.has(qq)) continue;
      const spouse = data.players[p.partner];
      if (!spouse) continue;
      seen.add(p.partner);
      coupleCount++;

      const card = document.createElement('div');
      card.className = 'couple-card' + (p.locked ? ' locked' : '');
      const bondText = p.locked ? '🔒 红线已锁 · 此情不换' : '今夜共舞 · 缘分 ' + (p.matchScore || 0);
      card.innerHTML = `
        <div class="couple-names">
          ${p.majia}<span class="heart">❤</span>${spouse.majia}
          <span class="vs">MASKED &nbsp;PAIR</span>
        </div>
        <div class="couple-bond">${bondText}</div>
        <div class="couple-wish">
          ${p.wish ? `<span class="tag gold">${p.majia}许愿：${p.wish}</span>` : ''}
          ${spouse.wish ? `<span class="tag rose">${spouse.majia}许愿：${spouse.wish}</span>` : ''}
        </div>`;
      grid.appendChild(card);
    }
    $('coupleCount').textContent = coupleCount;
    if (!coupleCount) {
      grid.innerHTML = '<div class="empty-tip">🌙 今夜尚无佳偶<br>静待红娘摇铃，缘分自来</div>';
    }

    // 任务（匹配成功后统一展示）
    if (coupleCount > 0) {
      $('taskBoard').style.display = '';
      const ul = $('taskList');
      ul.innerHTML = '';
      const tasks = data.tasks || [];
      if (!tasks.length) ul.innerHTML = '<li class="empty-tip">今夜暂无任务</li>';
      tasks.forEach(t => {
        const li = document.createElement('li');
        if (t.done) li.className = 'done';
        li.innerHTML = `<span class="t-dot">${t.done ? '✦' : '❖'}</span><span>${t.title}</span>`;
        ul.appendChild(li);
      });
    } else {
      $('taskBoard').style.display = 'none';
    }
  }

  // ===== 我的状态 =====
  function renderMyStatus(data, me) {
    myPlayer = me;
    $('myCard').style.display = '';
    $('openRegisterBtn').style.display = 'none';
    $('logoutBtn').style.display = '';
    $('identityPill').style.display = '';
    $('identityPill').textContent = `${me.gender === 'female' ? '👧' : '👦'} ${me.majia}`;
    $('balancePill').style.display = '';
    $('balancePill').textContent = '💎 ' + me.balance;
    $('myName').textContent = me.majia;

    if (me.status === 'matched' && me.partner) {
      const spouse = data.players[me.partner];
      $('myWaiting').style.display = 'none';
      $('myMatched').style.display = '';
      $('spouseName').textContent = spouse ? spouse.majia : '?';
      $('myBond').textContent = me.locked
        ? '🔒 红线已锁 · 此情不换'
        : '缘分牵引 · 今夜共舞（缘分 ' + (me.matchScore || 0) + '）';
      const lockEl = $('lockStatus');
      if (me.locked) {
        lockEl.textContent = '🔒 关系已锁定，本次舞会不可被替换';
        lockEl.style.color = 'var(--green)';
        $('lockBtn').disabled = true;
      } else {
        lockEl.textContent = '红线未锁，尚可更换';
        lockEl.style.color = '';
        $('lockBtn').disabled = false;
      }
      if (me.divorceRequested) {
        $('marriageTip').textContent = '你已递交离婚申请，等待对方回应…';
      } else if (me.divorcePending) {
        $('marriageTip').textContent = '舞伴向你递交了离婚申请，请处理';
      } else {
        $('marriageTip').textContent = '';
      }
    } else {
      $('myWaiting').style.display = '';
      $('myMatched').style.display = 'none';
    }
  }

  // ===== 刷新 =====
  async function refresh(force) {
    try {
      const data = await ZMD.load(force === true);
      renderBoard(data);
      const me = (myQQ && data.players[myQQ]) ? data.players[myQQ] : null;
      if (me) {
        renderMyStatus(data, me);
      } else {
        $('myCard').style.display = 'none';
        $('openRegisterBtn').style.display = '';
        $('logoutBtn').style.display = 'none';
        $('identityPill').style.display = 'none';
        $('balancePill').style.display = 'none';
      }
    } catch (e) {
      toast('加载失败: ' + e.message, 'error');
    }
  }

  // ===== 报名 =====
  async function register() {
    const qq = myQQ;
    const majia = $('majiaInput').value.trim();
    const wish = $('wishInput').value.trim();
    const about = $('aboutInput').value.trim();

    if (!qq || !/^\d{5,12}$/.test(qq)) { toast('请先点击按钮获取 QQ 号', 'error'); return; }
    if (!majia || majia.length !== 2) { toast('马甲必须是两个字', 'error'); return; }
    if (!chosenGender) { toast('请选择性别', 'error'); return; }

    localStorage.setItem('zmd_qq', qq);
    localStorage.setItem('zmd_majia', majia);

    $('registerBtn').disabled = true;
    try {
      const data = await ZMD.load();
      if (data.players[qq]) {
        const p = data.players[qq];
        p.majia = majia; p.gender = chosenGender;
        p.wish = wish; p.about = about;
        await ZMD.save(data, `玩家 ${majia} 更新信息`);
        toast('欢迎回来，面具已为你保留', 'success');
      } else {
        data.players[qq] = {
          qq, majia, gender: chosenGender,
          wish, about,
          balance: C.startBalance - C.costs.register,
          status: 'registered',
          partner: null, locked: false,
          matchScore: 0, registeredAt: Date.now()
        };
        await ZMD.save(data, `新玩家入场: ${majia}`);
        toast('入场成功！面具之下，缘分已启', 'success');
      }
      closeModal('registerModal');
      refresh(true);
    } catch (e) {
      toast('报名失败: ' + e.message, 'error');
    } finally {
      $('registerBtn').disabled = false;
    }
  }

  // ===== 婚配操作 =====
  async function doAction(action) {
    const data = await ZMD.load();
    const me = data.players[myQQ];
    if (!me || me.status !== 'matched' || !me.partner) {
      toast('当前没有婚配关系', 'error'); return;
    }
    const cost = C.costs[action];
    if (me.balance < cost) { toast(`灵石不足，需要 ${cost}`, 'error'); return; }
    const spouse = data.players[me.partner];

    if (action === 'lock') {
      if (me.locked) { toast('关系已锁定', 'error'); return; }
      me.balance -= cost;
      me.locked = true;
      if (spouse) spouse.locked = true;
      await ZMD.save(data, `${me.majia} 锁定关系`);
      toast('🔒 红线已锁，此情不换', 'success');
    } else if (action === 'divorce') {
      if (me.divorceRequested) { toast('你已递交离婚申请', 'error'); return; }
      me.balance -= cost;
      me.divorceRequested = true;
      if (spouse) spouse.divorcePending = true;
      await ZMD.save(data, `${me.majia} 申请离婚`);
      toast('离婚申请已递交，等待对方回应', 'success');
    } else if (action === 'forceUnbind') {
      me.balance -= cost;
      me.locked = false; me.partner = null; me.status = 'registered';
      me.divorceRequested = false; me.divorcePending = false; me.matchScore = 0;
      if (spouse) {
        spouse.locked = false; spouse.partner = null; spouse.status = 'registered';
        spouse.divorceRequested = false; spouse.divorcePending = false; spouse.matchScore = 0;
      }
      data.matches = (data.matches || []).filter(m =>
        !(m.includes(myQQ) || (spouse && m.includes(spouse.qq)))
      );
      await ZMD.save(data, `${me.majia} 强制解除婚配`);
      toast('⚡ 已强行斩断红线', 'success');
    }
    refresh(true);
  }

  async function handleDivorceRequest(agree) {
    const data = await ZMD.load();
    const me = data.players[myQQ];
    const spouse = me && me.partner ? data.players[me.partner] : null;
    if (!spouse) { toast('没有待处理的申请', 'error'); return; }
    if (agree) {
      me.partner = null; me.status = 'registered'; me.divorcePending = false; me.matchScore = 0;
      spouse.partner = null; spouse.status = 'registered'; spouse.divorceRequested = false; spouse.matchScore = 0;
      me.locked = false; spouse.locked = false;
      data.matches = (data.matches || []).filter(m => !m.includes(myQQ) && !m.includes(spouse.qq));
      await ZMD.save(data, `${me.majia} 同意离婚`);
      toast('💔 红线已断', 'success');
    } else {
      me.divorcePending = false;
      spouse.divorceRequested = false;
      await ZMD.save(data, `${me.majia} 拒绝离婚`);
      toast('已拒绝离婚申请', 'success');
    }
    refresh(true);
  }

  function confirmBox(title, text, onOk) {
    $('confirmTitle').textContent = title;
    $('confirmText').textContent = text;
    openModal('confirmModal');
    $('confirmOk').onclick = () => { closeModal('confirmModal'); onOk(); };
    $('confirmCancel').onclick = () => closeModal('confirmModal');
  }

  // ===== 初始化 =====
  function init() {
    document.querySelectorAll('.gender-btn').forEach(b => {
      b.addEventListener('click', () => {
        document.querySelectorAll('.gender-btn').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        chosenGender = b.dataset.g;
      });
    });

    $('fetchQqBtn').addEventListener('click', fetchQqFromBtn);

    // 手动填写 QQ（默认展开）
    $('qqManualBtn').addEventListener('click', () => {
      const v = $('qqManualInput').value.trim();
      if (!qqValid(v)) { toast('请输入 5-12 位 QQ 号', 'error'); return; }
      fillQQ(v);
      toast('已使用手动填写的 QQ 号', 'success');
    });

    $('openRegisterBtn').addEventListener('click', () => {
      // 同步弹窗里的 QQ 状态
      if (myQQ) {
        $('fetchQqBtn').textContent = '✅ 已获取：' + myQQ;
        $('fetchQqBtn').disabled = true;
        $('qqState').textContent = '已获取';
        $('qqState').style.color = 'var(--green)';
        $('qqManual').style.display = 'none';
      } else {
        $('fetchQqBtn').textContent = '🔄 尝试自动获取';
        $('fetchQqBtn').disabled = false;
        $('qqState').textContent = '未获取（可直接在下方手动填写）';
        $('qqState').style.color = '';
        $('qqManual').style.display = ''; // 默认展开
      }
      const me = myPlayer;
      if (me) {
        $('majiaInput').value = me.majia || '';
        $('wishInput').value = me.wish || '';
        $('aboutInput').value = me.about || '';
        chosenGender = me.gender || null;
        if (chosenGender) {
          document.querySelectorAll('.gender-btn').forEach(x => {
            x.classList.toggle('active', x.dataset.g === chosenGender);
          });
        }
      }
      openModal('registerModal');
    });
    $('closeRegister').addEventListener('click', () => closeModal('registerModal'));
    $('registerModal').addEventListener('click', e => {
      if (e.target === $('registerModal')) closeModal('registerModal');
    });

    $('registerBtn').addEventListener('click', register);
    $('majiaInput').addEventListener('input', () => {
      $('majiaInput').value = $('majiaInput').value.slice(0, 2);
    });
    $('lockBtn').addEventListener('click', () =>
      confirmBox('锁定红线', '扣除 1314 灵石，锁定后本次舞会不可被替换', () => doAction('lock')));
    $('divorceBtn').addEventListener('click', () =>
      confirmBox('递交离婚申请', '扣除 1111 灵石，需对方同意后生效', () => doAction('divorce')));
    $('forceBtn').addEventListener('click', () =>
      confirmBox('强制解除', '扣除 5555 灵石，无需对方同意，单方面斩断红线', () => doAction('forceUnbind')));
    $('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('zmd_qq');
      localStorage.removeItem('zmd_majia');
      location.href = location.pathname;
    });

    // 离婚申请轮询
    setInterval(async () => {
      if (!myQQ || !myPlayer || !myPlayer.divorcePending) return;
      if ($('confirmModal').style.display === 'flex') return;
      myPlayer.divorcePending = false;
      confirmBox('离婚申请', '舞伴向你递交了离婚申请，是否同意斩断红线？', (agree) => handleDivorceRequest(agree));
    }, 6000);

    // 大屏自动刷新
    setInterval(() => refresh(false), 20000);

    // 首次进入自动尝试一次抓 QQ
    const qq = detectQQ();
    if (qq) {
      fillQQ(qq);
      const savedMajia = localStorage.getItem('zmd_majia');
      if (savedMajia) $('majiaInput').value = savedMajia;
    }
    // 5 秒后还没拿到——主动给用户一个提醒（bridge 轮询还在后台跑）
    setTimeout(() => {
      if (!myQQ) {
        toast('自动获取 QQ 未成功，报名时可手动填写', 'error');
      }
    }, 5000);
    refresh(false);
  }
  init();
})();
</script>
</body>
</html>
