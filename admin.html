<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蒙面舞会 · 管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 登录 -->
<div id="adminLogin" class="page active">
  <div class="login-bg"></div>
  <div class="login-card">
    <div class="logo">🛡️</div>
    <h1 class="title">管理后台</h1>
    <div class="form-group">
      <label>管理员密码</label>
      <input type="password" id="adminPwd" placeholder="请输入管理员密码">
    </div>
    <button class="btn btn-primary" id="adminLoginBtn">进入后台</button>
  </div>
</div>

<!-- 后台主界面 -->
<div id="adminPanel" class="page">
  <header class="topbar">
    <div class="topbar-left">
      <span class="mask-icon">🛡️</span>
      <span class="user-majia">管理后台</span>
    </div>
    <div class="topbar-right">
      <button class="link-btn" onclick="location.href='index.html'">👤用户页</button>
      <button class="link-btn" onclick="location.href='screen.html'">📺大屏</button>
      <button class="link-btn" id="logoutBtn">退出</button>
    </div>
  </header>

  <main class="content" style="max-width:900px">
    <!-- 统计 + 操作 -->
    <div class="admin-actions">
      <div class="stat-card">
        <div class="stat-num" id="statTotal">0</div>
        <div class="stat-label">报名人数</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statWaiting">0</div>
        <div class="stat-label">待匹配</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statMatched">0</div>
        <div class="stat-label">已婚配</div>
      </div>
      <button class="btn btn-primary btn-match" id="matchBtn">🎲 开始匹配</button>
      <button class="btn btn-ghost" id="newRoundBtn">🔄 新一轮</button>
    </div>

    <!-- 玩家列表 -->
    <h2 class="section-title">📋 玩家列表</h2>
    <div class="table-wrap">
      <table class="data-table" id="playersTable">
        <thead>
          <tr>
            <th>QQ号</th><th>马甲</th><th>灵石</th><th>状态</th><th>舞伴</th><th>操作</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- 配对列表 -->
    <h2 class="section-title">💑 婚配列表</h2>
    <div class="table-wrap">
      <table class="data-table" id="matchesTable">
        <thead>
          <tr><th>马甲A</th><th>QQ</th><th>马甲B</th><th>QQ</th><th>锁定</th><th>操作</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- 任务管理 -->
    <h2 class="section-title">📝 任务管理</h2>
    <div class="task-add">
      <input type="text" id="newTaskInput" placeholder="输入新任务内容">
      <button class="btn btn-primary" id="addTaskBtn">添加</button>
    </div>
    <ul class="task-list" id="taskList"></ul>
  </main>
</div>

<!-- 调整灵石弹窗 -->
<div class="modal" id="balanceModal" style="display:none">
  <div class="modal-card">
    <h3>调整灵石</h3>
    <p id="balanceModalText"></p>
    <div class="form-group">
      <input type="number" id="balanceInput" placeholder="输入数量（正数增加，负数减少）">
    </div>
    <div class="modal-btns">
      <button class="btn btn-primary" id="balanceOk">确定</button>
      <button class="btn btn-ghost" id="balanceCancel">取消</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="config.js"></script>
<script src="data.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const C = ZMD.config;
  let data = null;
  let targetQQ = null;

  let toastTimer = null;
  function toast(msg, type) {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast show' + (type ? ' ' + type : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.className = 'toast', 2500);
  }

  function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    $(id).classList.add('active');
  }

  // 加载数据并渲染
  async function refresh() {
    try {
      data = await ZMD.load(true);
      renderStats();
      renderPlayers();
      renderMatches();
      renderTasks();
    } catch (e) {
      toast('加载失败: ' + e.message, 'error');
    }
  }

  function renderStats() {
    const players = Object.values(data.players);
    $('statTotal').textContent = players.length;
    $('statWaiting').textContent = players.filter(p => p.status === 'registered').length;
    $('statMatched').textContent = players.filter(p => p.status === 'matched').length;
  }

  function renderPlayers() {
    const tbody = $('playersTable').querySelector('tbody');
    tbody.innerHTML = '';
    const players = Object.values(data.players).sort((a,b) => (b.registeredAt||0) - (a.registeredAt||0));
    for (const p of players) {
      const spouse = p.partner ? data.players[p.partner] : null;
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${p.qq}</td>
        <td>${p.majia}</td>
        <td><b>${p.balance}</b> 💎</td>
        <td>${statusText(p)}</td>
        <td>${spouse ? spouse.majia : '-'}</td>
        <td>
          <button class="mini-btn" onclick="window._adjBal('${p.qq}')">调灵石</button>
          <button class="mini-btn danger" onclick="window._delPlayer('${p.qq}')">删除</button>
        </td>`;
      tbody.appendChild(tr);
    }
  }

  function statusText(p) {
    if (p.status === 'registered') return '<span style="color:var(--gold)">待匹配</span>';
    if (p.status === 'matched') return p.locked ? '<span style="color:var(--green)">已锁定</span>' : '<span style="color:var(--pink)">已婚配</span>';
    return p.status;
  }

  function renderMatches() {
    const tbody = $('matchesTable').querySelector('tbody');
    tbody.innerHTML = '';
    const seen = new Set();
    for (const qq in data.players) {
      const p = data.players[qq];
      if (p.status !== 'matched' || !p.partner || seen.has(qq)) continue;
      const spouse = data.players[p.partner];
      if (!spouse) continue;
      seen.add(p.partner);
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${p.majia}</td><td>${p.qq}</td>
        <td>${spouse.majia}</td><td>${spouse.qq}</td>
        <td>${p.locked ? '🔒' : '❌'}</td>
        <td><button class="mini-btn danger" onclick="window._forceDivorce('${qq}','${p.partner}')">强制解除</button></td>`;
      tbody.appendChild(tr);
    }
  }

  function renderTasks() {
    const ul = $('taskList');
    ul.innerHTML = '';
    (data.tasks || []).forEach((t, i) => {
      const li = document.createElement('li');
      li.className = 'task-item' + (t.done ? ' done' : '');
      li.innerHTML = `
        <span class="task-check" onclick="window._toggleTask(${i})">${t.done ? '✅' : '⬜'}</span>
        <span class="task-title">${t.title}</span>
        <button class="mini-btn danger" onclick="window._delTask(${i})">删除</button>`;
      ul.appendChild(li);
    });
  }

  // 开始匹配
  async function startMatch() {
    const waiting = Object.values(data.players).filter(p => p.status === 'registered');
    if (waiting.length < 2) { toast('至少需要2人才能匹配', 'error'); return; }
    if (!confirm(`当前 ${waiting.length} 人待匹配，确定开始摇骰配对？`)) return;

    ZMD.shuffle(waiting);
    const pairs = [];
    for (let i = 0; i + 1 < waiting.length; i += 2) {
      pairs.push([waiting[i], waiting[i + 1]]);
    }
    // 如果奇数，最后一人轮空
    let msg = `匹配结果：\n`;
    for (const [a, b] of pairs) {
      const da = ZMD.rollDice(), db = ZMD.rollDice();
      a.status = 'matched'; b.status = 'matched';
      a.partner = b.qq; b.partner = a.qq;
      a.dice = da; b.dice = db;
      a.locked = false; b.locked = false;
      data.matches.push([a.qq, b.qq]);
      msg += `${a.majia}(${da}) ❤ ${b.majia}(${db})\n`;
    }
    if (waiting.length % 2 === 1) {
      const last = waiting[waiting.length - 1];
      msg += `${last.majia} 轮空，继续等待\n`;
    }
    await ZMD.save(data, `管理员开始匹配，生成${pairs.length}对`);
    alert(msg);
    refresh();
  }

  // 新一轮
  async function newRound() {
    if (!confirm('确定开启新一轮？所有已婚配将被解除，待匹配玩家保留。')) return;
    data.round = (data.round || 1) + 1;
    for (const qq in data.players) {
      const p = data.players[qq];
      if (p.status === 'matched') {
        p.status = 'registered'; p.partner = null; p.locked = false;
        p.dice = null; p.divorceRequested = false; p.divorcePending = false;
      }
    }
    data.matches = [];
    await ZMD.save(data, `开启第${data.round}轮`);
    toast('已开启新一轮', 'success');
    refresh();
  }

  // 调整灵石
  window._adjBal = (qq) => {
    targetQQ = qq;
    const p = data.players[qq];
    $('balanceModalText').textContent = `${p.majia}（QQ:${qq}）当前灵石：${p.balance}`;
    $('balanceInput').value = '';
    $('balanceModal').style.display = 'flex';
  };
  $('balanceOk').onclick = async () => {
    const num = parseInt($('balanceInput').value);
    if (isNaN(num)) { toast('请输入数字', 'error'); return; }
    data = await ZMD.load();
    data.players[targetQQ].balance += num;
    await ZMD.save(data, `调整 ${data.players[targetQQ].majia} 灵石 ${num}`);
    $('balanceModal').style.display = 'none';
    toast('已调整', 'success');
    refresh();
  };
  $('balanceCancel').onclick = () => $('balanceModal').style.display = 'none';

  // 删除玩家
  window._delPlayer = async (qq) => {
    if (!confirm('确定删除该玩家？')) return;
    const p = data.players[qq];
    if (p.partner) {
      const spouse = data.players[p.partner];
      if (spouse) { spouse.partner = null; spouse.status = 'registered'; }
    }
    delete data.players[qq];
    data.matches = data.matches.filter(m => !m.includes(qq));
    await ZMD.save(data, `删除玩家 ${p.majia}`);
    refresh();
  };

  // 强制解除
  window._forceDivorce = async (a, b) => {
    if (!confirm('确定强制解除这对婚配？')) return;
    const pa = data.players[a], pb = data.players[b];
    if (pa) { pa.partner = null; pa.status = 'registered'; pa.locked = false; pa.dice = null; }
    if (pb) { pb.partner = null; pb.status = 'registered'; pb.locked = false; pb.dice = null; }
    data.matches = data.matches.filter(m => !m.includes(a) && !m.includes(b));
    await ZMD.save(data, '管理员强制解除婚配');
    refresh();
  };

  // 任务
  window._toggleTask = async (i) => {
    data.tasks[i].done = !data.tasks[i].done;
    await ZMD.save(data, '切换任务状态');
    refresh();
  };
  window._delTask = async (i) => {
    data.tasks.splice(i, 1);
    await ZMD.save(data, '删除任务');
    refresh();
  };
  $('addTaskBtn').onclick = async () => {
    const title = $('newTaskInput').value.trim();
    if (!title) return;
    data.tasks.push({ id: Date.now(), title, done: false });
    await ZMD.save(data, '添加任务');
    $('newTaskInput').value = '';
    refresh();
  };

  // 登录
  $('adminLoginBtn').onclick = () => {
    if ($('adminPwd').value === C.adminPassword) {
      showPage('adminPanel');
      refresh();
      setInterval(refresh, 10000);
    } else {
      toast('密码错误', 'error');
    }
  };
  $('logoutBtn').onclick = () => { showPage('adminLogin'); $('adminPwd').value = ''; };
  $('matchBtn').onclick = startMatch;
  $('newRoundBtn').onclick = newRound;
})();
</script>
</body>
</html>
