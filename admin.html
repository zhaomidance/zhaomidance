<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蒙面舞会 · 管理后台</title>
<link rel="stylesheet" href="style.css?v=20261025e">
</head>
<body>

<!-- 登录 -->
<div id="adminLogin" class="page active">
  <div class="login-wrap">
    <div class="login-card">
      <div class="logo">🎭</div>
      <h1 class="title">红娘阁</h1>
      <p class="subtitle">MASKED BALL · 后台管理</p>
      <div class="form-group">
        <label>管理员密码</label>
        <input type="password" id="adminPwd" placeholder="请输入管理员密码">
      </div>
      <button class="btn btn-gold btn-block" id="adminLoginBtn">进入后台</button>
    </div>
  </div>
</div>

<!-- 后台主界面 -->
<div id="adminPanel" class="page">
  <header class="topbar">
    <div class="topbar-left">
      <span class="mask-icon">🎭</span>
      <span class="user-majia">红娘阁 · 后台</span>
    </div>
    <div class="topbar-right">
      <button class="link-btn" onclick="location.href='index.html'">👤 大屏</button>
      <button class="link-btn" id="logoutBtn">退出</button>
    </div>
  </header>

  <main class="content">

    <!-- 大屏阶段控制 -->
    <h2 class="section-title">🎬 大屏阶段</h2>
    <div class="stage-row" id="stageRow">
      <button class="stage-btn" data-stage="registering">🔮 报名中</button>
      <button class="stage-btn" data-stage="round1">💫 第一次匹配</button>
      <button class="stage-btn" data-stage="round2">💫 第二次匹配</button>
      <button class="stage-btn" data-stage="final">💍 最终匹配</button>
    </div>

    <!-- 统计 + 操作 -->
    <div class="admin-actions">
      <div class="stat-card">
        <div class="stat-num" id="statTotal">0</div>
        <div class="stat-label">已报名</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statMale">0</div>
        <div class="stat-label">男待匹配</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statFemale">0</div>
        <div class="stat-label">女待匹配</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statMatched">0</div>
        <div class="stat-label">今夜佳偶</div>
      </div>
    </div>
    <div class="admin-btns">
      <button class="btn btn-gold btn-match" id="matchBtn">🌹 系统匹配</button>
      <button class="btn btn-ghost" id="newRoundBtn">🔄 新一轮</button>
      <button class="btn btn-primary" id="reportBtn">📊 灵石统计</button>
    </div>

    <!-- 白名单录入 -->
    <h2 class="section-title">🎫 报名人员录入（门票白名单）</h2>
    <div class="wl-box">
      <textarea id="wlInput" placeholder="每行一个人，格式：二字马甲,门票编号&#10;分隔符不限（逗号 / 空格 / 顿号 / 竖线 / 制表符均可）&#10;&#10;例：&#10;阿强,001&#10;小美 002&#10;阿龙|003"></textarea>
      <div class="wl-actions">
        <button class="btn btn-primary btn-sm" id="wlImportBtn">导入白名单</button>
        <button class="btn btn-ghost btn-sm" id="wlDemoBtn">查看示例格式</button>
        <input type="text" id="wlSearch" class="wl-search" placeholder="搜索马甲 / 门票">
        <span class="wl-count" id="wlCount">0 人</span>
      </div>
      <div class="wl-list" id="wlList"></div>
    </div>

    <!-- 待匹配玩家列表 -->
    <h2 class="section-title">📋 待匹配舞宾</h2>
    <div class="table-wrap">
      <table class="data-table" id="playersTable">
        <thead>
          <tr>
            <th>马甲</th><th>性别</th><th>状态</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- 结伴列表 -->
    <h2 class="section-title">💑 结伴舞宾</h2>
    <div class="table-wrap">
      <table class="data-table" id="matchesTable">
        <thead>
          <tr><th>马甲A</th><th>马甲B</th><th>确认</th><th>共池灵石</th><th>操作</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- 任务管理 -->
    <h2 class="section-title">📝 任务管理</h2>
    <div class="task-add">
      <input type="text" id="newTaskInput" placeholder="任务内容">
      <input type="number" id="newTaskUnlock" class="task-unlock-input" placeholder="解锁灵石" min="0">
      <button class="btn btn-primary btn-sm" id="addTaskBtn">添加</button>
    </div>
    <ul class="task-list" id="taskList"></ul>
  </main>
</div>

<!-- 灵石统计弹窗 -->
<div class="modal" id="reportModal" style="display:none">
  <div class="modal-card wide">
    <h3>📊 灵石统计</h3>
    <p class="report-sub">灰色理由仅用于查看，复制时不会带上</p>
    <div id="statsView" class="stats-view"></div>
    <div class="modal-btns">
      <button class="btn btn-primary" id="reportCopyBtn">📋 复制全部</button>
      <button class="btn btn-ghost" id="reportCloseBtn">关闭</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="config.js"></script>
<script src="data.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const C = ZMD.config;
  let data = null;

  let toastTimer = null;
  function toast(msg, type) {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast show' + (type ? ' ' + type : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.className = 'toast', 2500);
  }

  function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    $(id).classList.add('active');
  }

  function esc(s) {
    return String(s || '').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
  }

  // ===== 加载并渲染 =====
  async function refresh() {
    try {
      data = await ZMD.load(true);
      if (!data.whitelist) data.whitelist = [];
      renderStats();
      renderWhitelist();
      renderPlayers();
      renderMatches();
      renderTasks();
    } catch (e) {
      toast('加载失败: ' + e.message, 'error');
    }
  }

  function renderStats() {
    const players = Object.values(data.players || {});
    const waiting = players.filter(p => p.status === 'registered');
    $('statTotal').textContent = players.length;
    $('statMale').textContent = waiting.filter(p => p.gender === 'male').length;
    $('statFemale').textContent = waiting.filter(p => p.gender === 'female').length;
    let couples = 0;
    const seen = new Set();
    for (const key in data.players) {
      const p = data.players[key];
      if ((p.status === 'matched' || p.status === 'confirmed') && p.partner && !seen.has(key)) {
        seen.add(key); seen.add(p.partner); couples++;
      }
    }
    $('statMatched').textContent = couples;
    renderStage();
  }

  function renderStage() {
    const cur = data.stage || 'registering';
    document.querySelectorAll('.stage-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.stage === cur);
    });
  }

  // ===== 白名单 =====
  function renderWhitelist() {
    const kw = ($('wlSearch').value || '').trim();
    const list = (data.whitelist || []).filter(w =>
      !kw || w.majia.includes(kw) || String(w.ticket).includes(kw)
    );
    const box = $('wlList');
    box.innerHTML = '';
    box.innerHTML = list.map(w => {
      const player = data.players[w.majia];
      const state = player
        ? '<span class="wl-tag ok">已报名</span>'
        : (w.claimed ? '<span class="wl-tag warn">已占用</span>' : '<span class="wl-tag">待入场</span>');
      return `
        <div class="wl-item">
          <span class="wl-majia">${esc(w.majia)}</span>
          <span class="wl-ticket">${esc(w.ticket)}</span>
          ${state}
          <button class="mini-btn danger" onclick="window._delWl('${esc(w.majia)}','${esc(w.ticket)}')">移除</button>
        </div>`;
    }).join('');
    if (!list.length) {
      box.innerHTML = '<div class="wl-empty">尚未录入报名人员</div>';
    }
    $('wlCount').textContent = (data.whitelist || []).length + ' 人';
  }

  window._delWl = async (majia, ticket) => {
    if (!confirm(`确定从白名单移除 ${majia}（门票 ${ticket}）？`)) return;
    data = await ZMD.load(true);
    data.whitelist = (data.whitelist || []).filter(w => !(w.majia === majia && String(w.ticket) === String(ticket)));
    await ZMD.save(data, `移除白名单 ${majia}`);
    toast('已移除', 'success');
    refresh();
  };

  // 解析白名单文本：换行即一人，分隔符不限
  function parseWhitelist(text) {
    const out = [];
    (text || '').split(/\r?\n/).forEach(line => {
      const s = line.trim();
      if (!s) return;
      const parts = s.split(/[,，、\s|;；/\\·.。\t]+/).filter(Boolean);
      if (parts.length < 2) return;
      const majia = parts[0].slice(0, 2);
      const ticket = parts[1].trim();
      if (!majia || !ticket) return;
      out.push({ majia, ticket });
    });
    return out;
  }

  $('wlImportBtn').onclick = async () => {
    const raw = $('wlInput').value;
    const incoming = parseWhitelist(raw);
    if (!incoming.length) {
      toast('未解析到有效行，格式应为「二字马甲,门票编号」', 'error');
      return;
    }
    data = await ZMD.load(true);
    if (!data.whitelist) data.whitelist = [];
    let added = 0, skipped = 0;
    for (const item of incoming) {
      const exists = data.whitelist.some(w => w.majia === item.majia && String(w.ticket) === item.ticket);
      if (exists) { skipped++; continue; }
      data.whitelist.push({ majia: item.majia, ticket: item.ticket, claimed: false });
      added++;
    }
    await ZMD.save(data, `导入白名单 ${added} 人`);
    $('wlInput').value = '';
    toast(`导入完成：新增 ${added} 人，重复跳过 ${skipped} 人`, 'success');
    refresh();
  };
  $('wlDemoBtn').onclick = () => {
    $('wlInput').value = '阿强,001\n小美 002\n阿龙|003\n阿雅、004';
    toast('示例已填入，可直接点「导入白名单」', 'success');
  };
  $('wlSearch').addEventListener('input', () => { if (data) renderWhitelist(); });

  // ===== 玩家 =====
  function genderText(p) {
    if (p.gender === 'male') return '<span style="color:#93c5fd">👦 男</span>';
    if (p.gender === 'female') return '<span style="color:#f9a8d4">👧 女</span>';
    return '<span style="color:var(--text-dim)">?</span>';
  }

  function statusText(p) {
    if (p.status === 'registered') return '<span style="color:var(--gold)">待匹配</span>';
    if (p.status === 'matched') {
      return p.myConfirmed
        ? '<span style="color:var(--gold-soft)">待对方确认</span>'
        : '<span style="color:var(--rose)">待确认舞伴</span>';
    }
    if (p.status === 'confirmed') return '<span style="color:var(--green)">舞伴已确认</span>';
    return p.status;
  }

  function renderPlayers() {
    const tbody = $('playersTable').querySelector('tbody');
    tbody.innerHTML = '';
    const players = Object.values(data.players || {})
      .filter(p => p.status === 'registered')
      .sort((a,b) => (b.registeredAt||0) - (a.registeredAt||0));
    for (const p of players) {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><b>${esc(p.majia)}</b></td>
        <td>${genderText(p)}</td>
        <td>${statusText(p)}</td>`;
      tbody.appendChild(tr);
    }
    if (!players.length) {
      tbody.innerHTML = '<tr><td colspan="3" class="table-empty">🌙 暂无待匹配舞宾</td></tr>';
    }
  }

  // ===== 婚配 =====
  function renderMatches() {
    const tbody = $('matchesTable').querySelector('tbody');
    tbody.innerHTML = '';
    const seen = new Set();
    for (const key in data.players) {
      const p = data.players[key];
      if ((p.status !== 'matched' && p.status !== 'confirmed') || !p.partner || seen.has(key)) continue;
      const spouse = data.players[p.partner];
      if (!spouse) continue;
      seen.add(key); seen.add(p.partner);
      const pool = (p.deposit || 0) + (spouse.deposit || 0);
      const confirmed = p.status === 'confirmed' && spouse.status === 'confirmed';
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${esc(p.majia)}</td>
        <td>${esc(spouse.majia)}</td>
        <td>${confirmed ? '✅ 双方已确认' : (p.myConfirmed ? '⏳ 一方已确认' : '❌ 未确认')}</td>
        <td>${pool} 💎</td>
        <td><button class="mini-btn danger" onclick="window._forceDivorce('${esc(p.majia)}','${esc(spouse.majia)}')">强制解除</button></td>`;
      tbody.appendChild(tr);
    }
    if (!tbody.children.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="table-empty">🥀 暂无结伴舞宾</td></tr>';
    }
  }

  // ===== 任务 =====
  function renderTasks() {
    const ul = $('taskList');
    ul.innerHTML = '';
    const tasks = (data.tasks || []).slice().sort((a,b) => (a.unlock||0) - (b.unlock||0));
    tasks.forEach((t) => {
      const idx = data.tasks.indexOf(t);
      const li = document.createElement('li');
      li.className = 'task-item' + (t.done ? ' done' : '');
      li.innerHTML = `
        <span class="task-check" onclick="window._toggleTask(${idx})">${t.done ? '✅' : '⬜'}</span>
        <span class="task-title">${esc(t.title)}</span>
        <span class="task-unlock-badge">🔓 ${t.unlock || 0} 💎</span>
        <button class="mini-btn" onclick="window._editTaskTitle(${idx})">改字</button>
        <button class="mini-btn" onclick="window._editUnlock(${idx})">改值</button>
        <button class="mini-btn danger" onclick="window._delTask(${idx})">删除</button>`;
      ul.appendChild(li);
    });
    if (!tasks.length) {
      ul.innerHTML = '<li class="table-empty" style="text-align:center;color:var(--text-dim);padding:12px">今夜暂无任务</li>';
    }
  }

  // ===== 系统匹配 =====
  async function startMatch() {
    data = await ZMD.load(true);
    const waiting = Object.values(data.players).filter(p => p.status === 'registered');
    const males = waiting.filter(p => p.gender === 'male');
    const females = waiting.filter(p => p.gender === 'female');
    if (!males.length || !females.length) {
      toast(`男女各需至少 1 人（当前男 ${males.length} / 女 ${females.length}）`, 'error');
      return;
    }
    const n = Math.min(males.length, females.length);
    if (!confirm(`男宾 ${males.length} 人 / 女宾 ${females.length} 人\n系统将参考许愿偏好配对 ${n} 对，确定？`)) return;

    const pairs = ZMD.fateMatch(males, females);
    let msg = '匹配结果：\n';
    for (const pr of pairs) {
      const a = pr.a, b = pr.b;
      a.status = 'matched'; b.status = 'matched';
      a.partner = b.majia; b.partner = a.majia;
      a.myConfirmed = false; b.myConfirmed = false;
      a.deposit = 0; b.deposit = 0;
      a.matchScore = pr.score; b.matchScore = pr.score;
      if (!data.matches) data.matches = [];
      data.matches.push([a.majia, b.majia]);
      msg += `${a.majia} ❤ ${b.majia}\n`;
    }
    const usedM = new Set(pairs.map(p => p.a.majia));
    const usedF = new Set(pairs.map(p => p.b.majia));
    males.filter(p => !usedM.has(p.majia)).forEach(p => { msg += `${p.majia}（男宾）轮空\n`; });
    females.filter(p => !usedF.has(p.majia)).forEach(p => { msg += `${p.majia}（女宾）轮空\n`; });

    data.stage = nextStage(data.stage || 'registering');
    await ZMD.save(data, `系统匹配，生成${pairs.length}对`);
    alert(msg);
    refresh();
  }

  function nextStage(s) {
    if (s === 'registering') return 'round1';
    if (s === 'round1') return 'round2';
    if (s === 'round2') return 'final';
    return 'final';
  }

  // 新一轮（完全重置，二次确认）
  async function newRound() {
    if (!confirm('确定开启新一轮？本场所有舞宾、配对、灵石统计将被清空。')) return;
    if (!confirm('再次确认：此操作不可恢复！门票白名单会保留，其余数据全部重置为初始状态。')) return;
    data = await ZMD.load(true);
    data.round = (data.round || 1) + 1;
    data.players = {};
    data.matches = [];
    data.logs = [];
    data.stage = 'registering';
    (data.tasks || []).forEach(t => { t.done = false; });
    (data.whitelist || []).forEach(w => { w.claimed = false; delete w.claimedAt; });
    await ZMD.save(data, `开启第${data.round}轮，完全重置全部数据`);
    toast('已完成完全重置', 'success');
    refresh();
  }

  // ===== 玩家操作 =====
  window._delPlayer = async (majia) => {
    if (!confirm(`确定删除舞宾 ${majia}？`)) return;
    data = await ZMD.load(true);
    const p = data.players[majia];
    if (!p) return;
    if (p.partner) {
      const spouse = data.players[p.partner];
      if (spouse) { spouse.partner = null; spouse.status = 'registered'; spouse.myConfirmed = false; spouse.deposit = 0; }
    }
    delete data.players[majia];
    data.matches = (data.matches || []).filter(m => !m.includes(majia));
    const wl = (data.whitelist || []).find(w => w.majia === majia);
    if (wl) wl.claimed = false;
    await ZMD.save(data, `删除舞宾 ${majia}`);
    refresh();
  };

  window._forceDivorce = async (a, b) => {
    if (!confirm(`确定强制解除 ${a} ❤ ${b}？`)) return;
    data = await ZMD.load(true);
    const pa = data.players[a], pb = data.players[b];
    if (pa) { pa.partner = null; pa.status = 'registered'; pa.myConfirmed = false; pa.deposit = 0; pa.matchScore = 0; pa.divorceRequested = false; }
    if (pb) { pb.partner = null; pb.status = 'registered'; pb.myConfirmed = false; pb.deposit = 0; pb.matchScore = 0; pb.divorceRequested = false; }
    data.matches = (data.matches || []).filter(m => !m.includes(a) && !m.includes(b));
    await ZMD.save(data, '管理员强制解除婚配');
    refresh();
  };

  // ===== 任务操作 =====
  window._toggleTask = async (i) => {
    data = await ZMD.load(true);
    data.tasks[i].done = !data.tasks[i].done;
    await ZMD.save(data, '切换任务状态');
    refresh();
  };
  window._delTask = async (i) => {
    if (!confirm('确定删除该任务？')) return;
    data = await ZMD.load(true);
    data.tasks.splice(i, 1);
    await ZMD.save(data, '删除任务');
    refresh();
  };
  window._editTaskTitle = async (i) => {
    data = await ZMD.load(true);
    const cur = data.tasks[i].title || '';
    const v = prompt('修改任务文字：', cur);
    if (v === null) return;
    const title = v.trim();
    if (!title) { toast('任务文字不能为空', 'error'); return; }
    data.tasks[i].title = title;
    await ZMD.save(data, '修改任务文字');
    toast('任务文字已更新', 'success');
    refresh();
  };
  window._editUnlock = async (i) => {
    data = await ZMD.load(true);
    const cur = data.tasks[i].unlock || 0;
    const v = prompt('请输入解锁所需灵石数值：', cur);
    if (v === null) return;
    const num = parseInt(v, 10);
    if (isNaN(num) || num < 0) { toast('请输入有效数字', 'error'); return; }
    data.tasks[i].unlock = num;
    await ZMD.save(data, '修改任务解锁灵石');
    toast('已更新解锁灵石', 'success');
    refresh();
  };

  $('addTaskBtn').onclick = async () => {
    const title = $('newTaskInput').value.trim();
    const unlock = parseInt($('newTaskUnlock').value, 10);
    if (!title) { toast('请填写任务内容', 'error'); return; }
    if (isNaN(unlock) || unlock < 0) { toast('请填写解锁灵石数值', 'error'); return; }
    data = await ZMD.load(true);
    if (!data.tasks) data.tasks = [];
    data.tasks.push({ id: Date.now(), title, unlock, done: false });
    await ZMD.save(data, '添加任务');
    $('newTaskInput').value = '';
    $('newTaskUnlock').value = '';
    refresh();
  };

  // ===== 阶段切换 =====
  document.querySelectorAll('.stage-btn').forEach(b => {
    b.onclick = async () => {
      try {
        data = await ZMD.load(true);
        data.stage = b.dataset.stage;
        await ZMD.save(data, `设置大屏阶段: ${b.dataset.stage}`);
        toast('大屏阶段已更新', 'success');
        refresh();
      } catch (e) {
        toast('切换失败: ' + e.message, 'error');
      }
    };
  });

  // ===== 灵石统计 =====
  // 「批量减灵石」只在首行出现一次；按人分组，每人的扣分项按时间顺序排列
  let lastStatsCopy = '';
  function buildStats() {
    const rows = [];
    if (!data) return { rows };
    const logs = (data.logs || []).slice().sort((a, b) => (a.time || '').localeCompare(b.time || ''));
    const byActor = new Map();
    logs.forEach(l => {
      const amount = Number(l.amount) || 0;
      if (amount >= 0) return;
      if (!byActor.has(l.actor)) byActor.set(l.actor, []);
      byActor.get(l.actor).push({ text: l.actor + Math.abs(amount), reason: l.action });
    });
    byActor.forEach(items => { items.forEach(it => rows.push(it)); });
    return { rows };
  }

  function renderStats() {
    const { rows } = buildStats();
    const copyLines = ['批量减灵石'];
    const view = $('statsView');
    view.innerHTML = '';

    const head = document.createElement('div');
    head.className = 'stats-line stats-head';
    head.textContent = '批量减灵石';
    view.appendChild(head);

    if (!rows.length) {
      const empty = document.createElement('div');
      empty.className = 'stats-line stats-reason';
      empty.textContent = '（暂无扣分记录）';
      view.appendChild(empty);
    }
    rows.forEach(r => {
      copyLines.push(r.text);
      const line = document.createElement('div');
      line.className = 'stats-line';
      const main = document.createElement('span');
      main.textContent = r.text;
      const reason = document.createElement('span');
      reason.className = 'stats-reason';
      reason.textContent = '　' + r.reason;
      line.appendChild(main);
      line.appendChild(reason);
      view.appendChild(line);
    });

    lastStatsCopy = copyLines.join('\n');
    $('reportModal').style.display = 'flex';
  }

  $('reportBtn').onclick = async () => {
    data = await ZMD.load(true);
    renderStats();
  };
  $('reportCopyBtn').onclick = async () => {
    try {
      await navigator.clipboard.writeText(lastStatsCopy);
      toast('已复制（不含灰色理由）', 'success');
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = lastStatsCopy;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      toast('已复制（回退方式）', 'success');
    }
  };
  $('reportCloseBtn').onclick = () => { $('reportModal').style.display = 'none'; };

  // ===== 登录 =====
  $('adminLoginBtn').onclick = () => {
    if ($('adminPwd').value === C.adminPassword) {
      showPage('adminPanel');
      refresh();
      setInterval(refresh, 15000);
    } else {
      toast('密码错误', 'error');
    }
  };
  $('logoutBtn').onclick = () => { showPage('adminLogin'); $('adminPwd').value = ''; };
  $('matchBtn').onclick = startMatch;
  $('newRoundBtn').onclick = newRound;
})();
</script>
</body>
</html>
