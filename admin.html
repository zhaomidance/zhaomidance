<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蒙面舞会 · 管理后台</title>
<link rel="stylesheet" href="style.css?v=20261024d">
</head>
<body>

<!-- 登录 -->
<div id="adminLogin" class="page active">
  <div class="login-wrap">
    <div class="login-card">
      <div class="logo">🎭</div>
      <h1 class="title">红娘阁</h1>
      <p class="subtitle">MASKED BALL · 后台管理</p>
      <div class="form-group">
        <label>管理员密码</label>
        <input type="password" id="adminPwd" placeholder="请输入管理员密码">
      </div>
      <button class="btn btn-gold btn-block" id="adminLoginBtn">进入后台</button>
    </div>
  </div>
</div>

<!-- 后台主界面 -->
<div id="adminPanel" class="page">
  <header class="topbar">
    <div class="topbar-left">
      <span class="mask-icon">🛡️</span>
      <span class="user-majia">管理后台</span>
    </div>
    <div class="topbar-right">
      <button class="link-btn" onclick="location.href='index.html'">👤用户页/大屏</button>
      <button class="link-btn" id="logoutBtn">退出</button>
    </div>
  </header>

  <main class="content" style="max-width:900px">
    <!-- 大屏阶段控制 -->
    <h2 class="section-title">🎬 大屏阶段</h2>
    <div class="stage-row" id="stageRow">
      <button class="stage-btn" data-stage="registering">🔮 报名中</button>
      <button class="stage-btn" data-stage="round1">💫 第一次匹配</button>
      <button class="stage-btn" data-stage="round2">💫 第二次匹配</button>
      <button class="stage-btn" data-stage="final">💍 最终匹配</button>
    </div>

    <!-- 统计 + 操作 -->
    <div class="admin-actions">
      <div class="stat-card">
        <div class="stat-num" id="statTotal">0</div>
        <div class="stat-label">报名人数</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statMale">0</div>
        <div class="stat-label">男待匹配</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statFemale">0</div>
        <div class="stat-label">女待匹配</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statMatched">0</div>
        <div class="stat-label">今夜佳偶</div>
      </div>
      <button class="btn btn-gold btn-match" id="matchBtn">🌹 系统缘分匹配</button>
      <button class="btn btn-ghost" id="newRoundBtn">🔄 新一轮</button>
    </div>

    <!-- 玩家列表 -->
    <h2 class="section-title">📋 玩家列表</h2>
    <div class="table-wrap">
      <table class="data-table" id="playersTable">
        <thead>
          <tr>
            <th>身份</th><th>昵称</th><th>马甲</th><th>性别</th><th>灵石</th><th>状态</th><th>舞伴</th><th>许愿</th><th>自述</th><th>操作</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- 配对列表 -->
    <h2 class="section-title">💑 婚配列表</h2>
    <div class="table-wrap">
      <table class="data-table" id="matchesTable">
        <thead>
          <tr><th>马甲A</th><th>身份A</th><th>马甲B</th><th>身份B</th><th>缘分</th><th>锁定</th><th>操作</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- 任务管理 -->
    <h2 class="section-title">📝 任务管理</h2>
    <div class="task-add">
      <input type="text" id="newTaskInput" placeholder="输入新任务内容">
      <button class="btn btn-primary" id="addTaskBtn">添加</button>
    </div>
    <ul class="task-list" id="taskList"></ul>
  </main>
</div>

<!-- 调整灵石弹窗 -->
<div class="modal" id="balanceModal" style="display:none">
  <div class="modal-card">
    <h3>调整灵石</h3>
    <p id="balanceModalText"></p>
    <div class="form-group">
      <input type="number" id="balanceInput" placeholder="输入数量（正数增加，负数减少）">
    </div>
    <div class="modal-btns">
      <button class="btn btn-primary" id="balanceOk">确定</button>
      <button class="btn btn-ghost" id="balanceCancel">取消</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="config.js"></script>
<script src="data.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const C = ZMD.config;
  let data = null;
  let targetQQ = null;

  let toastTimer = null;
  function toast(msg, type) {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast show' + (type ? ' ' + type : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.className = 'toast', 2500);
  }

  function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    $(id).classList.add('active');
  }

  // 加载数据并渲染
  async function refresh() {
    try {
      data = await ZMD.load(true);
      renderStats();
      renderPlayers();
      renderMatches();
      renderTasks();
    } catch (e) {
      toast('加载失败: ' + e.message, 'error');
    }
  }

  function renderStats() {
    const players = Object.values(data.players);
    const waiting = players.filter(p => p.status === 'registered');
    $('statTotal').textContent = players.length;
    $('statMale').textContent = waiting.filter(p => p.gender === 'male').length;
    $('statFemale').textContent = waiting.filter(p => p.gender === 'female').length;
    let couples = 0;
    const seen = new Set();
    for (const qq in data.players) {
      const p = data.players[qq];
      if (p.status === 'matched' && p.partner && !seen.has(qq)) { seen.add(p.partner); couples++; }
    }
    $('statMatched').textContent = couples;
    renderStage();
  }

  function renderStage() {
    const cur = data.stage || 'registering';
    document.querySelectorAll('.stage-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.stage === cur);
    });
  }

  function genderText(p) {
    if (p.gender === 'male') return '<span style="color:#93c5fd">👦 男</span>';
    if (p.gender === 'female') return '<span style="color:#f9a8d4">👧 女</span>';
    return '<span style="color:var(--text-dim)">?</span>';
  }

  function esc(s) {
    return String(s || '').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
  }

  function renderPlayers() {
    const tbody = $('playersTable').querySelector('tbody');
    tbody.innerHTML = '';
    const players = Object.values(data.players).sort((a,b) => (b.registeredAt||0) - (a.registeredAt||0));
    for (const p of players) {
      const spouse = p.partner ? data.players[p.partner] : null;
      // 身份 ID 截断显示（openid 通常很长）
      const idDisplay = (p.qq || p.openid || '').length > 16
        ? (p.qq || p.openid).slice(0, 6) + '…' + (p.qq || p.openid).slice(-6)
        : (p.qq || p.openid || '-');
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td title="${esc(p.qq || p.openid || '')}">${esc(idDisplay)}</td>
        <td>${esc(p.nick) || '<span style="opacity:.4">-</span>'}</td>
        <td>${esc(p.majia)}</td>
        <td>${genderText(p)}</td>
        <td><b>${p.balance}</b> 💎</td>
        <td>${statusText(p)}</td>
        <td>${spouse ? spouse.majia : '-'}</td>
        <td>${esc(p.wish) || '<span style="opacity:.4">-</span>'}</td>
        <td>${esc(p.about) || '<span style="opacity:.4">-</span>'}</td>
        <td>
          <button class="mini-btn" onclick="window._adjBal('${(p.qq || p.openid || '').replace(/'/g, "\\'")}')">调灵石</button>
          <button class="mini-btn danger" onclick="window._delPlayer('${(p.qq || p.openid || '').replace(/'/g, "\\'")}')">删除</button>
        </td>`;
      tbody.appendChild(tr);
    }
    if (!players.length) {
      tbody.innerHTML = '<tr><td colspan="10" class="table-empty">🌙 今夜尚无人入场，静候嘉宾</td></tr>';
    }
  }

  function statusText(p) {
    if (p.status === 'registered') return '<span style="color:var(--gold)">待匹配</span>';
    if (p.status === 'matched') return p.locked ? '<span style="color:var(--green)">已锁定</span>' : '<span style="color:var(--rose)">已婚配</span>';
    return p.status;
  }

  function escId(s) {
    s = s || '';
    if (s.length > 16) return s.slice(0, 6) + '…' + s.slice(-6);
    return s;
  }
  function renderMatches() {
    const tbody = $('matchesTable').querySelector('tbody');
    tbody.innerHTML = '';
    const seen = new Set();
    for (const key in data.players) {
      const p = data.players[key];
      if (p.status !== 'matched' || !p.partner || seen.has(key)) continue;
      const spouse = data.players[p.partner];
      if (!spouse) continue;
      seen.add(p.partner);
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${p.majia}</td><td title="${esc(p.qq||p.openid||'')}">${escId(p.qq||p.openid)}</td>
        <td>${spouse.majia}</td><td title="${esc(spouse.qq||spouse.openid||'')}">${escId(spouse.qq||spouse.openid)}</td>
        <td>缘分 ${p.matchScore || 0}</td>
        <td>${p.locked ? '🔒' : '❌'}</td>
        <td><button class="mini-btn danger" onclick="window._forceDivorce('${key.replace(/'/g, "\\'")}','${p.partner.replace(/'/g, "\\'")}')">强制解除</button></td>`;
      tbody.appendChild(tr);
    }
    if (!tbody.children.length) {
      tbody.innerHTML = '<tr><td colspan="7" class="table-empty">🥀 今夜尚无佳偶</td></tr>';
    }
  }

  function renderTasks() {
    const ul = $('taskList');
    ul.innerHTML = '';
    (data.tasks || []).forEach((t, i) => {
      const li = document.createElement('li');
      li.className = 'task-item' + (t.done ? ' done' : '');
      li.innerHTML = `
        <span class="task-check" onclick="window._toggleTask(${i})">${t.done ? '✅' : '⬜'}</span>
        <span class="task-title">${t.title}</span>
        <button class="mini-btn danger" onclick="window._delTask(${i})">删除</button>`;
      ul.appendChild(li);
    });
  }

  // ===== 系统缘分匹配（参考许愿偏好，非骰子） =====
  async function startMatch() {
    data = await ZMD.load(true);
    const waiting = Object.values(data.players).filter(p => p.status === 'registered');
    const males = waiting.filter(p => p.gender === 'male');
    const females = waiting.filter(p => p.gender === 'female');
    if (!males.length || !females.length) {
      toast(`男女各需至少1人（当前男 ${males.length} / 女 ${females.length}）`, 'error');
      return;
    }
    const n = Math.min(males.length, females.length);
    if (!confirm(`男宾 ${males.length} 人 / 女宾 ${females.length} 人\n系统将参考许愿偏好配对 ${n} 对，确定？`)) return;

    const pairs = ZMD.fateMatch(males, females);
    let msg = '缘分匹配结果：\n';
    for (const pr of pairs) {
      const a = pr.a, b = pr.b;
      a.status = 'matched'; b.status = 'matched';
      a.partner = b.qq; b.partner = a.qq;
      a.locked = false; b.locked = false;
      a.matchScore = pr.score; b.matchScore = pr.score;
      a.divorceRequested = false; a.divorcePending = false;
      b.divorceRequested = false; b.divorcePending = false;
      if (!data.matches) data.matches = [];
      data.matches.push([a.qq, b.qq]);
      msg += `${a.majia} ❤ ${b.majia}（缘分 ${pr.score}）\n`;
    }
    // 轮空提示
    const usedM = new Set(pairs.map(p => p.a.qq));
    const usedF = new Set(pairs.map(p => p.b.qq));
    males.filter(p => !usedM.has(p.qq)).forEach(p => { msg += `${p.majia}（男宾）轮空，继续等待\n`; });
    females.filter(p => !usedF.has(p.qq)).forEach(p => { msg += `${p.majia}（女宾）轮空，继续等待\n`; });

    // 匹配后自动推进大屏阶段
    data.stage = nextStage(data.stage || 'registering');
    await ZMD.save(data, `系统缘分匹配，生成${pairs.length}对`);
    alert(msg);
    refresh();
  }

  function nextStage(s) {
    if (s === 'registering') return 'round1';
    if (s === 'round1') return 'round2';
    if (s === 'round2') return 'final';
    return 'final';
  }

  // 新一轮
  async function newRound() {
    if (!confirm('确定开启新一轮？所有已婚配将被解除，待匹配玩家保留。')) return;
    data.round = (data.round || 1) + 1;
    for (const qq in data.players) {
      const p = data.players[qq];
      if (p.status === 'matched') {
        p.status = 'registered'; p.partner = null; p.locked = false;
        p.matchScore = 0; p.divorceRequested = false; p.divorcePending = false;
      }
    }
    data.matches = [];
    data.stage = 'registering';
    await ZMD.save(data, `开启第${data.round}轮`);
    toast('已开启新一轮', 'success');
    refresh();
  }

  // 调整灵石
  window._adjBal = (qq) => {
    targetQQ = qq;
    const p = data.players[qq];
    $('balanceModalText').textContent = `${p.majia}（QQ:${qq}）当前灵石：${p.balance}`;
    $('balanceInput').value = '';
    $('balanceModal').style.display = 'flex';
  };
  $('balanceOk').onclick = async () => {
    const num = parseInt($('balanceInput').value);
    if (isNaN(num)) { toast('请输入数字', 'error'); return; }
    data = await ZMD.load();
    data.players[targetQQ].balance += num;
    await ZMD.save(data, `调整 ${data.players[targetQQ].majia} 灵石 ${num}`);
    $('balanceModal').style.display = 'none';
    toast('已调整', 'success');
    refresh();
  };
  $('balanceCancel').onclick = () => $('balanceModal').style.display = 'none';

  // 删除玩家
  window._delPlayer = async (qq) => {
    if (!confirm('确定删除该玩家？')) return;
    const p = data.players[qq];
    if (p.partner) {
      const spouse = data.players[p.partner];
      if (spouse) { spouse.partner = null; spouse.status = 'registered'; }
    }
    delete data.players[qq];
    data.matches = (data.matches || []).filter(m => !m.includes(qq));
    await ZMD.save(data, `删除玩家 ${p.majia}`);
    refresh();
  };

  // 强制解除
  window._forceDivorce = async (a, b) => {
    if (!confirm('确定强制解除这对婚配？')) return;
    const pa = data.players[a], pb = data.players[b];
    if (pa) { pa.partner = null; pa.status = 'registered'; pa.locked = false; pa.matchScore = 0; }
    if (pb) { pb.partner = null; pb.status = 'registered'; pb.locked = false; pb.matchScore = 0; }
    data.matches = data.matches.filter(m => !m.includes(a) && !m.includes(b));
    await ZMD.save(data, '管理员强制解除婚配');
    refresh();
  };

  // 任务
  window._toggleTask = async (i) => {
    data.tasks[i].done = !data.tasks[i].done;
    await ZMD.save(data, '切换任务状态');
    refresh();
  };
  window._delTask = async (i) => {
    data.tasks.splice(i, 1);
    await ZMD.save(data, '删除任务');
    refresh();
  };
  $('addTaskBtn').onclick = async () => {
    const title = $('newTaskInput').value.trim();
    if (!title) return;
    data.tasks.push({ id: Date.now(), title, done: false });
    await ZMD.save(data, '添加任务');
    $('newTaskInput').value = '';
    refresh();
  };

  // 阶段切换
  document.querySelectorAll('.stage-btn').forEach(b => {
    b.onclick = async () => {
      try {
        data = await ZMD.load();
        data.stage = b.dataset.stage;
        await ZMD.save(data, `设置大屏阶段: ${b.dataset.stage}`);
        toast('大屏阶段已更新', 'success');
        refresh();
      } catch (e) {
        toast('切换失败: ' + e.message, 'error');
      }
    };
  });

  // 登录
  $('adminLoginBtn').onclick = () => {
    if ($('adminPwd').value === C.adminPassword) {
      showPage('adminPanel');
      refresh();
      setInterval(refresh, 15000);
    } else {
      toast('密码错误', 'error');
    }
  };
  $('logoutBtn').onclick = () => { showPage('adminLogin'); $('adminPwd').value = ''; };
  $('matchBtn').onclick = startMatch;
  $('newRoundBtn').onclick = newRound;
})();
</script>
</body>
</html>
