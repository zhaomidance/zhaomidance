<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蒙面舞会 · 大屏</title>
<link rel="stylesheet" href="style.css">
<style>
  body { background: radial-gradient(ellipse at top, #2d1b4e 0%, #0f0a1e 70%); min-height: 100vh; }
  .screen-header { text-align: center; padding: 24px 16px 8px; }
  .screen-title { font-size: 42px; font-weight: 900; background: linear-gradient(135deg, var(--gold), var(--pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 4px; }
  .screen-sub { color: var(--text-dim); margin-top: 6px; font-size: 16px; }
  .screen-body { padding: 16px; max-width: 1400px; margin: 0 auto; }
  .screen-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; margin-top: 16px; }
  @media (max-width: 900px) { .screen-grid { grid-template-columns: 1fr; } }
  .screen-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; backdrop-filter: blur(10px); }
  .screen-card h3 { color: var(--gold); margin-bottom: 16px; font-size: 20px; }
  .couple-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .couple-box { background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 12px; padding: 16px; text-align: center; }
  .couple-box .names { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  .couple-box .names .heart { color: var(--red); margin: 0 10px; animation: beat 1s infinite; }
  @keyframes beat { 0%,100%{transform:scale(1)} 50%{transform:scale(1.3)} }
  .couple-box .dice { color: var(--gold); font-size: 14px; margin-bottom: 6px; }
  .couple-box .bal { color: var(--text-dim); font-size: 13px; }
  .couple-box.locked { border-color: var(--green); box-shadow: 0 0 12px rgba(34,197,94,0.3); }
  .couple-box.locked .lock-badge { display: inline-block; }
  .lock-badge { display: none; color: var(--green); font-size: 12px; margin-top: 4px; }
  .waiting-area { margin-top: 14px; }
  .waiting-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: rgba(245,197,66,0.15); border: 1px solid var(--border); border-radius: 20px; padding: 6px 14px; font-size: 14px; }
  .task-list-screen li { padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; gap: 10px; font-size: 16px; }
  .task-list-screen li.done { text-decoration: line-through; opacity: 0.5; }
  .empty-tip { color: var(--text-dim); text-align: center; padding: 30px; }
  .back-link { position: fixed; top: 16px; right: 16px; z-index: 10; }
</style>
</head>
<body>
<a class="back-link link-btn" href="index.html">← 返回</a>

<div class="screen-header">
  <div class="screen-title">🎭 蒙面舞会</div>
  <div class="screen-sub" id="roundInfo">第 1 轮舞会</div>
</div>

<div class="screen-body">
  <div class="screen-grid">
    <!-- 左侧：婚配列表 -->
    <div class="screen-card">
      <h3>💑 婚配列表</h3>
      <div class="couple-grid" id="coupleGrid"></div>
      <div class="waiting-area">
        <h3 style="margin-top:20px">⏳ 待匹配 <span id="waitingCount" style="color:var(--text-dim);font-size:14px">(0人)</span></h3>
        <div class="waiting-chips" id="waitingChips"></div>
      </div>
    </div>
    <!-- 右侧：任务 -->
    <div class="screen-card">
      <h3>📝 舞会任务</h3>
      <ul class="task-list-screen" id="taskScreenList"></ul>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="data.js"></script>
<script>
(async function(){
  async function refresh() {
    try {
      const data = await ZMD.load(true);
      document.getElementById('roundInfo').textContent = `第 ${data.round} 轮舞会`;

      // 婚配列表
      const grid = document.getElementById('coupleGrid');
      grid.innerHTML = '';
      const seen = new Set();
      let hasCouple = false;
      for (const qq in data.players) {
        const p = data.players[qq];
        if (p.status !== 'matched' || !p.partner || seen.has(qq)) continue;
        const spouse = data.players[p.partner];
        if (!spouse) continue;
        seen.add(p.partner);
        hasCouple = true;
        const avgBal = Math.floor((p.balance + spouse.balance) / 2);
        const div = document.createElement('div');
        div.className = 'couple-box' + (p.locked ? ' locked' : '');
        div.innerHTML = `
          <div class="names">${p.majia}<span class="heart">❤</span>${spouse.majia}</div>
          <div class="dice">🎲 ${p.dice} : ${spouse.dice}</div>
          <div class="bal">平均灵石：${avgBal} 💎</div>
          <div class="lock-badge">🔒 关系已锁定</div>`;
        grid.appendChild(div);
      }
      if (!hasCouple) grid.innerHTML = '<div class="empty-tip">暂无婚配，等待管理员开始匹配...</div>';

      // 待匹配
      const waiting = Object.values(data.players).filter(p => p.status === 'registered');
      document.getElementById('waitingCount').textContent = `(${waiting.length}人)`;
      const chips = document.getElementById('waitingChips');
      chips.innerHTML = '';
      waiting.forEach(p => {
        const c = document.createElement('span');
        c.className = 'chip';
        c.textContent = p.majia;
        chips.appendChild(c);
      });

      // 任务
      const tlist = document.getElementById('taskScreenList');
      tlist.innerHTML = '';
      (data.tasks || []).forEach(t => {
        const li = document.createElement('li');
        if (t.done) li.className = 'done';
        li.innerHTML = `<span>${t.done ? '✅' : '⬜'}</span><span>${t.title}</span>`;
        tlist.appendChild(li);
      });
    } catch (e) {
      console.error(e);
    }
  }
  refresh();
  setInterval(refresh, 5000);
})();
</script>
</body>
</html>
